<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Mes contacts</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Mes contacts</h2>
            <a th:href="@{/contacts/create}" class="btn btn-primary">+ Nouveau contact</a>
        </div>
        <a th:href="@{/contacts}" class="btn btn-outline-primary btn-sm">Tous</a>
        <a th:each="cat : ${categories}"
           th:href="@{/contacts(categoryId=${cat.id})}"
           th:text="${cat.name}"
           class="btn btn-outline-primary btn-sm">
        </a>
        <hr>
        <table class="table">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Catégorie</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="contact : ${contacts}">
                <td th:text="${contact.firstName + ' ' + contact.lastName}"></td>
                <td th:text="${contact.email}"></td>
                <td th:text="${contact.phone}"></td>
                <td th:text="${contact.category != null ? contact.category.name : '-'}"></td>
                <td>
                    <a th:href="@{'/contacts/delete/' + ${contact.id}}"
                       onclick="return confirm('Supprimer ce contact ?')"
                       class="text-danger">
                        Supprimer
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(contacts)}">
                <td colspan="4" class="text-center text-muted">Aucun contact</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
